# Publish @octichq/telemetry.
#
# Two destinations, wired side by side:
#
#   GitHub Packages  — always. The repo is private, so the package inherits
#                      that visibility and only the org (plus repos granted
#                      access) can install it. Versions here can be deleted.
#   public npm       — off. Gated behind the `npm` input, which ci.yml passes
#                      as `false`. Flipping that one literal to `true` is what
#                      makes the SDK public, and it is deliberately the only
#                      thing standing between here and an immutable artifact.
#
# Called by ci.yml only, and only when release-please reports that it created a
# release for the `node` component — that is, when the Release PR was merged
# and `node/vX.Y.Z` now exists. Merging an ordinary pull request never reaches
# here.
#
# That gate is the whole reason this repo uses release-please rather than the
# org's usual semantic-release: an npm version is immutable and cannot be
# unpublished after 72 hours, so there is one human review between a merged
# commit and a permanent public artifact. See
# handbook/adr/0002-per-sdk-versioning.md.
name: Publish Node

on:
  workflow_call:
    inputs:
      npm:
        description: >-
          Also publish to public npm. Leave false until the SDK is ready to be
          public — an npm version cannot be unpublished after 72 hours and the
          number can never be reused.
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  # ─────────────────────────────────────────────
  # GitHub Packages — the pre-public destination
  # ─────────────────────────────────────────────
  github-packages:
    name: GitHub Packages publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # The registry this publishes to. `secrets.GITHUB_TOKEN` with this scope
      # is the credential — no PAT, nothing long-lived.
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # registry-url writes the .npmrc that points npm at GitHub Packages and
      # wires NODE_AUTH_TOKEN into it.
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          registry-url: https://npm.pkg.github.com

      # The stub was `private: true` so that a pipeline exercised before the SDK
      # arrived could not publish an empty package. npm does not reliably refuse
      # a private package on its own — `npm publish --dry-run` cheerfully accepts
      # one — so the guard is here rather than assumed. Kept as a backstop: it
      # now reads false, and anyone setting it back to true stops both
      # destinations at once.
      - name: Guard on the private flag
        id: guard
        working-directory: node
        run: |
          private="$(jq -r '.private // false' package.json)"
          if [ "$private" = "true" ]; then
            echo '::notice::node/package.json is private — skipping publish.'
            echo 'skip=true' >> "$GITHUB_OUTPUT"
          else
            echo 'skip=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Install dependencies
        if: steps.guard.outputs.skip != 'true'
        working-directory: node
        run: npm ci

      # `prepack` builds. The registry is named explicitly rather than left to
      # publishConfig, because this package has two destinations and a registry
      # pinned in package.json would silently win over one of them.
      - name: Publish
        if: steps.guard.outputs.skip != 'true'
        working-directory: node
        run: npm publish --registry=https://npm.pkg.github.com
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ─────────────────────────────────────────────
  # Public npm — dormant until `npm: true`
  # ─────────────────────────────────────────────
  #
  # Everything here is wired and ready; only the `if` keeps it asleep. Do not
  # enable it before the SDK is safe to run in someone else's process — see
  # migration_plan.md §2 (non-interference) and §3 (token refresh).
  npm:
    name: npm publish
    if: inputs.npm
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      # Required for npm trusted publishing (OIDC). This is what replaces a
      # long-lived NPM_TOKEN secret, and it is what mints the provenance
      # attestation that shows on the package page.
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          registry-url: https://registry.npmjs.org

      # Trusted publishing needs npm 11.5.1 or newer. Node 24 ships something
      # close enough that it usually works and occasionally does not, which is
      # the worst kind of dependency.
      - name: Ensure npm supports trusted publishing
        run: npm install -g npm@^11.5.1

      - name: Guard on the private flag
        id: guard
        working-directory: node
        run: |
          private="$(jq -r '.private // false' package.json)"
          if [ "$private" = "true" ]; then
            echo '::notice::node/package.json is private — skipping publish.'
            echo 'skip=true' >> "$GITHUB_OUTPUT"
          else
            echo 'skip=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Install dependencies
        if: steps.guard.outputs.skip != 'true'
        working-directory: node
        run: npm ci

      # `prepack` builds, `publishConfig.access` makes the scoped package
      # public, `--provenance` mints the attestation. No NODE_AUTH_TOKEN:
      # authentication is the OIDC token minted above. If trusted publishing is
      # ever unavailable, the fallback is an
      # `NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}` env on this step — at the
      # cost of a long-lived credential and no provenance.
      - name: Publish
        if: steps.guard.outputs.skip != 'true'
        working-directory: node
        run: npm publish --registry=https://registry.npmjs.org --provenance

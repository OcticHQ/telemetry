# The Python SDK's checks: lint, format, typecheck, tests, build.
#
# Called by both pr.yml and ci.yml, each gating it on `python` appearing in the
# changed-component list the way they gate Node.
#
# No publish here — publish-python.yml owns that, triggered by the release tag.
name: Python

on:
  workflow_call:

permissions:
  contents: read

defaults:
  run:
    working-directory: python

jobs:
  # Lint, format and typecheck once, on the floor version. mypy is pinned to
  # `python_version = "3.10"` in pyproject.toml either way; running it on 3.10
  # also means the interpreter agrees with the checker about what exists.
  static:
    name: Lint, format, typecheck
    runs-on: ubuntu-24.04-arm

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.10'
          cache: pip
          cache-dependency-path: python/pyproject.toml

      # `--group` needs pip 25.1 or newer, which is newer than some runner
      # images ship.
      - name: Install
        run: |
          python -m pip install --upgrade 'pip>=25.1'
          python -m pip install -e . --group dev

      - name: Lint
        run: python -m ruff check src tests

      - name: Format
        run: python -m ruff format --check src tests

      - name: Typecheck
        run: python -m mypy src tests

  # Tests on the declared floor and on a current release. The floor is a
  # claim `pyproject.toml` makes to every installer, and a claim nothing runs
  # is how the Node SDK came to say `>=20` while CI only ever saw 24.
  test:
    name: Tests (Python ${{ matrix.python }})
    runs-on: ubuntu-24.04-arm
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.13']

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: python/pyproject.toml

      - name: Install
        run: |
          python -m pip install --upgrade 'pip>=25.1'
          python -m pip install -e . --group dev

      - name: Test
        run: python -m pytest

  # The analogue of the Node SDK's `pack:check`: build what a consumer would
  # actually install and inspect it, rather than trusting that the package
  # metadata describes the artifact. `py.typed` is asserted explicitly because
  # its absence is silent — the `Typing :: Typed` classifier keeps claiming the
  # package is typed and a consumer's mypy is the thing that finds out.
  build:
    name: Build
    runs-on: ubuntu-24.04-arm

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.10'
          cache: pip
          cache-dependency-path: python/pyproject.toml

      - name: Install
        run: |
          python -m pip install --upgrade 'pip>=25.1'
          python -m pip install -e . --group dev

      - name: Build
        run: python -m build

      - name: Check the distributions
        run: python -m twine check --strict dist/*

      - name: Assert the wheel ships py.typed and the licence
        run: |
          python - <<'PY'
          import glob, sys, zipfile

          wheels = glob.glob('dist/*.whl')
          if len(wheels) != 1:
              sys.exit(f'expected exactly one wheel, found {wheels}')

          names = zipfile.ZipFile(wheels[0]).namelist()
          missing = [
              want
              for want in ('octichq_airlock_sdk/py.typed',)
              if want not in names
          ]
          if not any(n.endswith('licenses/LICENSE') for n in names):
              missing.append('dist-info/licenses/LICENSE')
          if missing:
              sys.exit(f'{wheels[0]} is missing {missing}')

          print(f'{wheels[0]}: py.typed and LICENSE present')
          PY

# The Python SDK's checks: lint, format, typecheck, tests.
#
# Called by both pr.yml and ci.yml, and for now it runs unconditionally, the
# way the contract gate does. The per-language `if:` those files use is keyed
# off the components registered with release-please, and `python` is not one
# yet — registering it is what makes it releasable, and that waits for the
# package to be complete. Until then, running on every pull request costs a
# minute and means the suite is gating from the first commit that has one.
#
# No publish here, and no pack. Both arrive with the release wiring.
name: Python

on:
  workflow_call:

permissions:
  contents: read

defaults:
  run:
    working-directory: python

jobs:
  # Lint, format and typecheck once, on the floor version. mypy is pinned to
  # `python_version = "3.10"` in pyproject.toml either way; running it on 3.10
  # also means the interpreter agrees with the checker about what exists.
  static:
    name: Lint, format, typecheck
    runs-on: ubuntu-24.04-arm

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.10'
          cache: pip
          cache-dependency-path: python/pyproject.toml

      # `--group` needs pip 25.1 or newer, which is newer than some runner
      # images ship.
      - name: Install
        run: |
          python -m pip install --upgrade 'pip>=25.1'
          python -m pip install -e . --group dev

      - name: Lint
        run: python -m ruff check src tests

      - name: Format
        run: python -m ruff format --check src tests

      - name: Typecheck
        run: python -m mypy src tests

  # Tests on the declared floor and on a current release. The floor is a
  # claim `pyproject.toml` makes to every installer, and a claim nothing runs
  # is how the Node SDK came to say `>=20` while CI only ever saw 24.
  test:
    name: Tests (Python ${{ matrix.python }})
    runs-on: ubuntu-24.04-arm
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.13']

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: python/pyproject.toml

      - name: Install
        run: |
          python -m pip install --upgrade 'pip>=25.1'
          python -m pip install -e . --group dev

      - name: Test
        run: python -m pytest

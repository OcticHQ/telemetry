# Publish octic-telemetry.
#
# Two destinations, wired side by side — the same shape as _publish-node.yml,
# with one difference forced by the ecosystem:
#
#   workflow artifact — always. GitHub Packages hosts no Python index, so there
#                       is no registry to mirror npm's pre-public one. What
#                       takes its place is the built wheel and sdist, uploaded
#                       and retained, so every tag has an inspectable artifact
#                       whether or not the upload below ran.
#   PyPI              — gated behind the `pypi` input, so a release can be cut
#                       without publishing one.
#
# Called by ci.yml only, and only when release-please reports that it created a
# release for the `python` component — that is, when the Release PR was merged
# and `python/vX.Y.Z` now exists. Merging an ordinary pull request never reaches
# here.
#
# The gate matters more here than it does for npm, not less. A PyPI version
# cannot be replaced, and yanking one does not free the number: a yanked release
# stays on the index forever and the version can never be reused. There is no
# 72-hour window. See handbook/adr/0002-per-sdk-versioning.md.
name: Publish Python

on:
  workflow_call:
    inputs:
      pypi:
        description: >-
          Also publish to PyPI. Leave false until the SDK is ready to be public
          — a PyPI version can never be replaced or reused, and yanking one does
          not free the number.
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  # ─────────────────────────────────────────────
  # The artifact — the pre-public destination
  # ─────────────────────────────────────────────
  artifact:
    name: Build and upload
    runs-on: ubuntu-latest
    permissions:
      contents: read

    defaults:
      run:
        working-directory: python

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.10'
          cache: pip
          cache-dependency-path: python/pyproject.toml

      - name: Install
        run: |
          python -m pip install --upgrade 'pip>=25.1'
          python -m pip install -e . --group dev

      - name: Build
        run: python -m build

      # The same check the PyPI upload would run, run here so a failure happens
      # before anything is permanent rather than after.
      - name: Check the distributions
        run: python -m twine check --strict dist/*

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: octic-telemetry-dist
          path: python/dist/
          if-no-files-found: error

  # ─────────────────────────────────────────────
  # PyPI
  # ─────────────────────────────────────────────
  #
  # Authenticates as a trusted publisher on the PyPI project, which names this
  # repository, this workflow file and the `pypi` environment. Nothing here
  # holds a credential; change any of those three and the upload stops being
  # authorised.
  pypi:
    name: PyPI publish
    if: inputs.pypi
    needs: artifact
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      # Required for PyPI trusted publishing (OIDC). This is what replaces a
      # long-lived API token, and it is what mints the attestations that show on
      # the project page.
      id-token: write

    steps:
      # The distributions published are the ones already built and checked
      # above, not a second build — a rebuild is a different artifact from the
      # one the previous job verified, however deterministic it is meant to be.
      - name: Download the distributions
        uses: actions/download-artifact@v4
        with:
          name: octic-telemetry-dist
          path: dist

      # No password and no API token: authentication is the OIDC token minted
      # from the permission above. If trusted publishing is ever unavailable,
      # the fallback is a `password: ${{ secrets.PYPI_TOKEN }}` on this step —
      # at the cost of a long-lived credential and no attestations.
      - name: Publish
        uses: pypa/gh-action-pypi-publish@release/v1

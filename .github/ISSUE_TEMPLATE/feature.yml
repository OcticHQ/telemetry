name: Feature request
description: Something the SDK should be able to do.
labels: ['enhancement']
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: >
        What are you trying to find out about your agents that you cannot
        today? Describe the question, not the API — the API is our job and the
        question is the part we cannot guess.
    validations:
      required: true

  - type: textarea
    id: workaround
    attributes:
      label: What you do instead today
    validations:
      required: true

  - type: dropdown
    id: kind
    attributes:
      label: What kind of change is this?
      options:
        - A new annotation or option in an existing SDK
        - A new attribute in the contract
        - Support for an instrumentation library we do not handle well
        - An SDK for another language
        - Something else
    validations:
      required: true

  - type: markdown
    attributes:
      value: |
        **If this is a new attribute**, note that the contract
        ([`contract/ATTRIBUTES.md`](https://github.com/OcticHQ/octic-telemetry/blob/main/contract/ATTRIBUTES.md))
        is shared by every SDK and by our ingest path — additions are cheap,
        renames are not.
